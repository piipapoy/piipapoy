<svg viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#804dfa" />
      <stop offset="50%" stop-color="#B59DF8" />
      <stop offset="100%" stop-color="#804dfa" />
    </linearGradient>
  </defs>
  <style>
    @keyframes fall {
      0% { transform: translateY(-20px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(120px); opacity: 0; }
    }
    .s {
      font-family: Arial, sans-serif;
      font-size: 20px;
      fill: #fff;
      opacity: 0;
    }
  </style>
  <text class="s" x="5%" y="0"><animate attributeName="y" values="-20;120" dur="8s" repeatCount="indefinite" begin="0s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="8s" repeatCount="indefinite" begin="0s" />❅</text>
  <text class="s" x="15%" y="0"><animate attributeName="y" values="-20;120" dur="9s" repeatCount="indefinite" begin="-2s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="9s" repeatCount="indefinite" begin="-2s" />❅</text>
  <text class="s" x="25%" y="0"><animate attributeName="y" values="-20;120" dur="7s" repeatCount="indefinite" begin="-4s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="7s" repeatCount="indefinite" begin="-4s" />❅</text>
  <text class="s" x="35%" y="0"><animate attributeName="y" values="-20;120" dur="10s" repeatCount="indefinite" begin="-1s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="10s" repeatCount="indefinite" begin="-1s" />❅</text>
  <text class="s" x="45%" y="0"><animate attributeName="y" values="-20;120" dur="8.5s" repeatCount="indefinite" begin="-5s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="8.5s" repeatCount="indefinite" begin="-5s" />❅</text>
  <text class="s" x="55%" y="0"><animate attributeName="y" values="-20;120" dur="7.5s" repeatCount="indefinite" begin="-3s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="7.5s" repeatCount="indefinite" begin="-3s" />❅</text>
  <text class="s" x="65%" y="0"><animate attributeName="y" values="-20;120" dur="9.5s" repeatCount="indefinite" begin="-6s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="9.5s" repeatCount="indefinite" begin="-6s" />❅</text>
  <text class="s" x="75%" y="0"><animate attributeName="y" values="-20;120" dur="8s" repeatCount="indefinite" begin="-7s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="8s" repeatCount="indefinite" begin="-7s" />❅</text>
  <text class="s" x="85%" y="0"><animate attributeName="y" values="-20;120" dur="6.5s" repeatCount="indefinite" begin="-2.5s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="6.5s" repeatCount="indefinite" begin="-2.5s" />❅</text>
  <text class="s" x="95%" y="0"><animate attributeName="y" values="-20;120" dur="9s" repeatCount="indefinite" begin="-4.5s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="9s" repeatCount="indefinite" begin="-4.5s" />❅</text>
  <text x="50%" y="56%" dominant-baseline="central" text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
