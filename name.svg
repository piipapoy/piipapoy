<svg fill="none" viewBox="0 0 800 120" width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradientText {
          0%   { background-position: 0% 50%; }
          50%  { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        .name {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
          margin: 0;
          font-size: 3.2em;
          font-weight: 900;
          letter-spacing: -0.04em;
          text-align: center;
          line-height: 1.1;
          background: linear-gradient(270deg, #804dfa 0%, #B59DF8 40%, #804dfa 100%);
          background-size: 200%;
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradientText 4s ease infinite;
        }
        .sub {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
          margin: 0;
          font-size: 0.85em;
          font-weight: 500;
          text-align: center;
          color: #7A7469;
          letter-spacing: 0.02em;
          margin-top: 4px;
        }
      </style>
      <p class="name">M. Raffa Mizanul Insan</p>
      <p class="sub">UI/UX Designer · Frontend Developer · Video Editor</p>
    </div>
  </foreignObject>
</svg>
