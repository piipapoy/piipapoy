<svg viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#804dfa" />
      <stop offset="50%" stop-color="#B59DF8" />
      <stop offset="100%" stop-color="#804dfa" />
    </linearGradient>
  </defs>
  <style>
    .p { animation: float 4s ease-in-out infinite; }
    .p:nth-child(2) { animation-delay: -1s; }
    .p:nth-child(3) { animation-delay: -2s; }
    .p:nth-child(4) { animation-delay: -3s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); opacity: 0.3; }
      50% { transform: translate(0, -8px); opacity: 0.7; }
    }
  </style>
  <circle class="p" cx="15%" cy="70%" r="2" fill="#B59DF8" opacity="0.3" />
  <circle class="p" cx="85%" cy="30%" r="2.5" fill="#B59DF8" opacity="0.3" />
  <circle class="p" cx="92%" cy="65%" r="1.5" fill="#B59DF8" opacity="0.3" />
  <circle class="p" cx="8%" cy="40%" r="1.8" fill="#B59DF8" opacity="0.3" />
  <text x="50%" y="56%" dominant-baseline="central" text-anchor="middle"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="54" font-weight="900" letter-spacing="-2" fill="url(#grad)">
    M. Raffa Mizanul Insan
  </text>
</svg>
